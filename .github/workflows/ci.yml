name: ProtSat verification gate

# The gate script is the real check; this workflow only runs it on a clean machine.
# See protosat/scripts/ci.sh for what each gate means.

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

jobs:
  protosat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (the Lean toolchain manager)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache the toolchain and the lake build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            ${{ github.workspace }}/protosat/.lake
          key: protosat-${{ runner.os }}-${{ hashFiles('**/lean-toolchain', '**/lake-manifest.json') }}

      - name: Show the resolved toolchain
        working-directory: protosat
        run: lean --version && lake --version

      - name: Verification gate (build, axiom audit, inventory, demo, budgets)
        working-directory: protosat
        run: ./scripts/ci.sh
