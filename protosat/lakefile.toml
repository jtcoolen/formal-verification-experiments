name = "protosat"
version = "0.1.0"
defaultTargets = ["ProtSat", "protosatDemo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "ProtSat"
globs = ["ProtSat.+"]

[[lean_exe]]
name = "protosatDemo"
root = "Main"

[[lean_exe]]
name = "axioms"
root = "Axioms"
