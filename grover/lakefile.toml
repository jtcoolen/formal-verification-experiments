name = "grover"
version = "0.1.0"
defaultTargets = ["grover", "Grover"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Grover"
roots = ["Grover"]
globs = ["Grover.*"]

[[lean_exe]]
name = "grover"
root = "Main"
