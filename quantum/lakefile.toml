name = "quantum"
version = "0.1.0"
defaultTargets = ["quantum", "Quantum", "LambdaSat", "Shor"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.26.0"

[[lean_lib]]
name = "Quantum"
roots = ["Quantum"]
globs = ["Quantum", "Quantum.+", "Quantum.**"]

[[lean_exe]]
name = "quantum"
root = "Main"

[[lean_lib]]
name = "LambdaSat"
roots = ["LambdaSat"]
globs = ["LambdaSat", "LambdaSat.+"]

[[lean_lib]]
name = "Shor"
roots = ["Shor"]
globs = ["Shor", "Shor.+", "Shor.**"]

[[lean_exe]]
name = "proptests"
root = "PropertyTests"

[[lean_exe]]
name = "diag"
root = "Diag"
