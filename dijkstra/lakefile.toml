name = "dijkstra"
version = "0.1.0"
defaultTargets = ["dijkstra", "Dijkstra"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Dijkstra"
roots = ["Dijkstra"]
globs = ["Dijkstra.*"]

[[lean_exe]]
name = "dijkstra"
root = "Main"
